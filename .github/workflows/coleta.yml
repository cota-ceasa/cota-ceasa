name: coleta

on:
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial (AAAA-MM-DD)"
        required: false
        default: "2026-01-01"
      ceasa:
        description: "CEASA (opcional)"
        required: false
        default: ""
      max:
        description: "Máximo de itens a coletar"
        required: false
        default: "500"
      discover:
        description: "Parâmetro de discover (opcional)"
        required: false
        default: ""

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    # Evita que o job fique preso indefinidamente consumindo minutos
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar pacotes
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Coletar
        timeout-minutes: 30
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INICIO: ${{ github.event.inputs.inicio }}
          CEASA: ${{ github.event.inputs.ceasa }}
          MAX: ${{ github.event.inputs.max }}
          DISCOVER: ${{ github.event.inputs.discover }}
          # Log em tempo real (sem buffer) para ver onde o script trava
          PYTHONUNBUFFERED: "1"
          # Relógio do runner no horário de Brasília, para o --parar-as funcionar
          TZ: America/Sao_Paulo
        run: |
          ARGS=()
          [ -n "$INICIO" ] && ARGS+=(--inicio "$INICIO")
          [ -n "$CEASA" ] && ARGS+=(--ceasa "$CEASA")
          [ -n "$MAX" ] && ARGS+=(--max "$MAX")
          [ -n "$DISCOVER" ] && ARGS+=(--discover "$DISCOVER")
          echo "Hora local do runner: $(date)"
          echo "Argumentos: ${ARGS[@]}"
          python -u -m coleta.run --parar-as 20:40 "${ARGS[@]}"
