name: Coleta CEASA

on:
  schedule:
    # Horários de Brasília (cron em UTC = Brasília + 3h). Minuto 07 evita a fila do minuto 00.
    - cron: "7 6 * * *"    # 03:07
    - cron: "7 8 * * *"    # 05:07
    - cron: "7 10 * * *"   # 07:07
  workflow_dispatch:
    inputs:
      inicio:
        description: "Baixar desde (AAAA-MM-DD). Vazio = últimos 30 dias"
        default: "2020-01-01"
      ceasa:
        description: "IDs separados por espaço (vazio = todas)"
        default: ""
      max:
        description: "Máx. de boletins novos por CEASA (vazio = padrão)"
        default: "5000"
      discover:
        description: "Só inspecionar o formulário desta CEASA (ex.: ES)"
        default: ""
  push:
    branches: [main]
    paths: ["docs/**"]   # mudou o app → só republica o site

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Coletar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Sem valor digitado, usa as variáveis do repositório (Settings → Variables).
          # HISTORICO_INICIO=2021-12-01 faz toda execução agendada continuar a carga histórica.
          INICIO: ${{ inputs.inicio || vars.HISTORICO_INICIO }}
          CEASA: ${{ inputs.ceasa }}
          MAX: ${{ inputs.max || vars.HISTORICO_MAX || '40' }}
          DISCOVER: ${{ inputs.discover }}
        run: |
          ARGS=()
          [ -n "$INICIO" ] && ARGS+=(--inicio "$INICIO")
          [ -n "$CEASA" ] && ARGS+=(--ceasa $CEASA)
          [ -n "$MAX" ] && ARGS+=(--max "$MAX")
          [ -n "$DISCOVER" ] && ARGS+=(--discover "$DISCOVER")
          python -m coleta.run --parar-as 20:40 "${ARGS[@]}"

      - name: Guardar PDFs e diagnósticos (7 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida
          path: saida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Salvar dados.json no repositório
        if: always()
        run: |
          git config user.name "coleta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json
          git diff --cached --quiet || { git commit -m "dados: $(date -u +%F)" && git push; }

  publicar:
    needs: coleta
    if: always() && needs.coleta.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}   # pega o dados.json recém-salvo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
